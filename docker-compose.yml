# Start:  docker compose up -d
# Stop:   docker compose down        (keeps the data)
# Reset:  docker compose down -v     (deletes the data, Flyway re-creates it on next app start)

services:
  tickets-db:
    image: postgres:17
    container_name: tickets-db
    environment:
      POSTGRES_DB: tickets
      POSTGRES_PASSWORD: secret
    ports:
      - "55432:5432"            # 5432 and 5433 are taken by the Windows Postgres installs
    volumes:
      - tickets-data:/var/lib/postgresql/data

volumes:
  tickets-data:

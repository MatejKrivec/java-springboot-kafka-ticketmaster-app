# Runs all tests on every push and pull request.
# GitHub's Ubuntu machines have Docker, so the Testcontainers tests work here too.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
